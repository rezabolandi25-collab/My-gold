name: Update gold price

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get 18k gold price from TGJU
        shell: python
        run: |
          import urllib.request
          import re
          import json
          import datetime
          import html as html_lib

          url = "https://gem.tgju.org/profile/geram18"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
          })
          raw = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
          text = html_lib.unescape(raw)
          text = re.sub(r"<script.*?</script>", " ", text, flags=re.S | re.I)
          text = re.sub(r"<style.*?</style>", " ", text, flags=re.S | re.I)
          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          matches = re.findall(r"نرخ\s*فعلی\s*[:：]?\s*([0-9۰-۹][0-9۰-۹,]*)", text)
          trans = str.maketrans("۰۱۲۳۴۵۶۷۸۹", "0123456789")
          price = None
          for raw_price in matches:
              value = int(raw_price.translate(trans).replace(",", ""))
              if 10_000_000 <= value <= 2_000_000_000:
                  price = value
                  break

          if price is None:
              raise SystemExit("Could not find a valid 18k gold price on TGJU")

          data = {
              "price_rial": price,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "source": "TGJU / geram18"
          }
          with open("price.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("18k gold price (rial):", price)

      - name: Commit updated price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --cached --quiet || git commit -m "Update 18k gold price"
          git push
