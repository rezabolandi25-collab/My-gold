name: Update gold price

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get 18k gold price from Telegram
        shell: python
        run: |
          import urllib.request
          import urllib.error
          import re
          import json
          import datetime
          import html as html_lib

          url = "https://t.me/s/tgjunews"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
              }
          )

          raw = urllib.request.urlopen(req, timeout=30).read().decode(
              "utf-8", "ignore"
          )

          text = html_lib.unescape(raw)

          text = re.sub(
              r"<script.*?</script>",
              " ",
              text,
              flags=re.S | re.I
          )

          text = re.sub(
              r"<style.*?</style>",
              " ",
              text,
              flags=re.S | re.I
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          posts = re.split(r"قیمت طلای 18 عیار", text)

          trans = str.maketrans(
              "۰۱۲۳۴۵۶۷۸۹",
              "0123456789"
          )

          price = None

          for post in reversed(posts):

              match = re.search(
                  r"قیمت\s*لحظه\s*ای\s*[:：]?\s*"
                  r"([0-9۰-۹][0-9۰-۹,]*)\s*ریال",
                  post[:2500]
              )

              if match:

                  value = int(
                      match.group(1)
                      .translate(trans)
                      .replace(",", "")
                  )

                  if 10_000_000 <= value <= 2_000_000_000:
                      price = value
                      break

          if price is None:
              raise SystemExit(
                  "Could not find a valid 18k gold price in Telegram"
              )

          data = {
              "price_rial": price,
              "updated_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).strftime("%Y-%m-%d %H:%M UTC"),
              "source": "Telegram / @tgjunews"
          }

          with open(
              "price.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("18k gold price (rial):", price)

      - name: Update price.json through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        shell: python

        run: |

          import urllib.request
          import urllib.error
          import json
          import base64
          import time

          api = (
              f"https://api.github.com/repos/"
              f"{REPO}/contents/price.json"
          )

          headers = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "gold-price-updater"
          }

          content = open(
              "price.json",
              "rb"
          ).read()

          encoded = base64.b64encode(
              content
          ).decode()

          for attempt in range(1, 6):

              try:

                  get_req = urllib.request.Request(
                      api,
                      headers=headers
                  )

                  with urllib.request.urlopen(
                      get_req,
                      timeout=30
                  ) as response:

                      current = json.load(response)

                  payload = json.dumps({
                      "message": "Update 18k gold price",
                      "content": encoded,
                      "sha": current["sha"],
                      "branch": "main"
                  }).encode()

                  put_req = urllib.request.Request(
                      api,
                      data=payload,
                      headers
