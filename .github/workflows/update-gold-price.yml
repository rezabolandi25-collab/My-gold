name: Update gold price

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get 18k gold price from TGJU
        shell: python
        run: |
          import urllib.request
          import re
          import json
          import datetime
          import html

          url = "https://www.tgju.org/profile/tgju_gold_irg18/today"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
              }
          )

          raw = urllib.request.urlopen(req, timeout=30).read().decode(
              "utf-8", "ignore"
          )

          text = html.unescape(raw)

          # حذف تگ‌های HTML
          text = re.sub(
              r"<script.*?</script>",
              " ",
              text,
              flags=re.S | re.I
          )

          text = re.sub(
              r"<style.*?</style>",
              " ",
              text,
              flags=re.S | re.I
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          # تبدیل اعداد فارسی به انگلیسی
          trans = str.maketrans(
              "۰۱۲۳۴۵۶۷۸۹",
              "0123456789"
          )

          # پیدا کردن «نرخ فعلی»
          matches = re.findall(
              r"نرخ\s*فعلی\s*[:：]?\s*([0-9۰-۹][0-9۰-۹,]*)",
              text
          )

          price = None

          for item in matches:
              value = int(
                  item.translate(trans).replace(",", "")
              )

              # محدوده منطقی قیمت یک گرم طلای 18 عیار
              if 10_000_000 <= value <= 1_000_000_000:
                  price = value
                  break

          if price is None:
              raise Exception(
                  "18k gold price was not found on TGJU"
              )

          data = {
              "price_rial": price,
              "updated_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).strftime("%Y-%m-%d %H:%M UTC"),
              "source": "TGJU"
          }

          with open(
              "price.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("18k gold price:", price)

      - name: Update price.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        shell: python
        run: |
          import urllib.request
          import urllib.error
          import json
          import base64
          import time

          api = (
              f"https://api.github.com/repos/"
              f"{REPO}/contents/price.json"
          )

          headers = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "gold-price-updater"
          }

          content = open(
              "price.json",
              "rb"
          ).read()

          encoded = base64.b64encode(
              content
          ).decode()

          for attempt in range(5):

              try:

                  # گرفتن SHA فعلی price.json
                  get_request = urllib.request.Request(
                      api,
                      headers=headers
                  )

                  with urllib.request.urlopen(
                      get_request,
                      timeout=30
                  ) as response:

                      current = json.load(response)

                  payload = json.dumps({
                      "message": "Update gold price",
                      "content": encoded,
                      "sha": current["sha"],
                      "branch": "main"
                  }).encode()

                  put_request = urllib.request.Request(
                      api,
                      data=payload,
                      headers={
                          **headers,
                          "Content-Type":
                          "application/json"
                      },
                      method="PUT"
                  )

                  with urllib.request.urlopen(
                      put_request,
                      timeout=30
                  ) as response:

                      print(
                          "price.json updated:",
                          response.status
                      )

                  break

              except urllib.error.HTTPError as e:

                  if e.code == 409 and attempt < 4:
                      print("Conflict. Retrying...")
                      time.sleep(3)
                      continue

                  raise
