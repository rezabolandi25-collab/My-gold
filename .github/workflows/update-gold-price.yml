name: Update gold price

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get 18k gold price
        shell: python
        run: |
          import urllib.request
          import re
          import json
          import datetime

          url = "https://www.tgju.org/profile/tgju_gold_irg18/today"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
              "Accept-Language": "fa-IR,fa;q=0.9,en-US;q=0.8,en;q=0.7",
              "Accept-Encoding": "identity",
              "Referer": "https://www.tgju.org/",
              "Connection": "keep-alive",
              "Upgrade-Insecure-Requests": "1",
              "Sec-Fetch-Dest": "document",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "same-origin",
              "Sec-Fetch-User": "?1",
              "Cache-Control": "max-age=0",
          }

          req = urllib.request.Request(url, headers=headers)

          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read().decode("utf-8", "ignore")
              print("Response status:", response.status)
              print("Response length:", len(raw))

          m = re.search(
              r'data-col="info\.last_trade\.PDrCotVal"[^>]*>([0-9,]+)',
              raw
          )

          if not m:
              m = re.search(
                  r'<span class="title">نرخ فعلی::</span>\s*<span class="price"[^>]*>([0-9,]+)</span>',
                  raw
              )

          if not m:
              m = re.search(
                  r'نرخ فعلی[:：\s]*([0-9]{1,3}(?:,[0-9]{3}){2,})',
                  raw
              )

          if not m:
              candidates = re.findall(r'([0-9]{1,3}(?:,[0-9]{3}){2,})', raw)
              for c in candidates:
                  val = int(c.replace(",", ""))
                  if 100_000_000 <= val <= 500_000_000:
                      price = val
                      break
              else:
                  print("=== DEBUG ===")
                  print(raw[:1500])
                  raise Exception("18k gold price was not found")
          else:
              price = int(m.group(1).replace(",", ""))

          print("Found price:", price)

          if not (50_000_000 <= price <= 1_000_000_000):
              raise Exception(f"Price out of expected range: {price}")

          data = {
              "price_rial": price,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "source": "TGJU"
          }

          with open("price.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Saved price.json")

      - name: Update price.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import urllib.request
          import urllib.error
          import json
          import base64
          import time
          import os

          REPO = os.environ["REPO"]
          GH_TOKEN = os.environ["GH_TOKEN"]

          api = f"https://api.github.com/repos/{REPO}/contents/price.json"

          headers = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "gold-price-updater"
          }

          content = open("price.json", "rb").read()
          encoded = base64.b64encode(content).decode()

          for attempt in range(5):
              try:
                  sha = None
                  try:
                      get_request = urllib.request.Request(api, headers=headers)
                      with urllib.request.urlopen(get_request, timeout=30) as response:
                          current = json.load(response)
                          sha = current["sha"]
                  except urllib.error.HTTPError as e:
                      if e.code != 404:
                          raise

                  payload_dict = {
                      "message": "Update gold price",
                      "content": encoded,
                      "branch": "main"
                  }
                  if sha:
                      payload_dict["sha"] = sha

                  payload = json.dumps(payload_dict).encode()

                  put_request = urllib.request.Request(
                      api,
                      data=payload,
                      headers={**headers, "Content-Type": "application/json"},
                      method="PUT"
                  )

                  with urllib.request.urlopen(put_request, timeout=30) as response:
                      print("price.json updated successfully:", response.status)
                  break

              except urllib.error.HTTPError as e:
                  if e.code == 409 and attempt < 4:
                      print("Conflict. Retrying...")
                      time.sleep(3)
                      continue
                  raise
